<div class="container">
    <div class="d-flex justify-content-end mt-5">
        <button class="btn btn-outline-dark mb-3" (click)="addForm()">Add Employee</button>
        <a class="btn btn-outline-dark mb-3 ms-3"routerLink="">Back</a>
        <router-outlet></router-outlet>
    </div>
    @if (isAddForm) {
       <form [formGroup]="form" (submit)="onSave()">
        <div class="mb-3">
            <input type="text" placeholder="Add Name" class="form-control" formControlName="name">
        </div>
        <div class="mb-3">
            <input type="email" placeholder="Add Email" class="form-control" formControlName="email">
        </div>
        <div class="mb-3">
            <input type="number" placeholder="Add Age" class="form-control" formControlName="age">
        </div>
        <div class="mb-3">
            <input type="number" placeholder="Add Phone" class="form-control" formControlName="phone">
        </div>
        <div class="mb-3">
            <input type="number" placeholder="Add Salary" class="form-control" formControlName="salary">
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn btn-outline-primary" [disabled]="!form.valid">Save</button>
        </div>
       </form>
    }
</div>









@if (employeeList && employeeList.length>0) {
    <div class="container mt-5">
        <table class="table table-dark table-striped">
            <thead>
              <tr>
                <th scope="col">Id</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Age</th>
                <th scope="col">Phone</th>
                <th scope="col">Salary</th>
              </tr>
            </thead>
            <tbody>
                @for (emp of employeeList; track emp){
                    <tr>
                        <th scope="row">{{emp.id}}</th>
                        <td>{{emp.name}}</td>
                        <td>{{emp.email}}</td>
                        <td>{{emp.age}}</td>
                        <td>{{emp.phone}}</td>
                        <td>{{emp.salary}}</td>
                      </tr>
                }
            </tbody>
          </table>
    </div>
}
